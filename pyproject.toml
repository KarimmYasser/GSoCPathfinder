[project]
name = "gsoc-pathfinder"
version = "0.1.0"
description = "AI-powered GSoC organization matching engine"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.20",
    "qdrant-client>=1.9",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "thefuzz>=0.22",
    "openai>=1.30",
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "maturin>=1.14.0",
    "rust-engine",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.workspace]
members = [
    "rust_engine",
]

[tool.uv.sources]
rust-engine = { workspace = true }
