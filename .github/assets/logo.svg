<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 555 170" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#2b62d9" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#c5281c" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBC05" />
      <stop offset="100%" stop-color="#dda103" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#247c3c" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#4285F4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .card-bg {
      fill: #ffffff;
      stroke: #e1e4e8;
      stroke-width: 1.5;
    }
    .text-bold {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 40px;
      font-weight: 800;
      fill: #4285F4;
    }
    .text-light {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 40px;
      font-weight: 300;
      fill: #24292f;
    }
    @media (prefers-color-scheme: dark) {
      .card-bg {
        fill: #0d1117;
        stroke: #30363d;
      }
      .text-light {
        fill: #adbac7;
      }
    }
  </style>

  <!-- Container Box / Card with generous padding -->
  <rect class="card-bg" x="15" y="15" width="525" height="140" rx="22" />

  <!-- Background Glow behind the compass -->
  <circle cx="110" cy="85" r="55" fill="url(#glow)" />

  <!-- Graph Network Nodes & Connections (Outer Compass Ring) -->
  <g stroke="#80868b" stroke-width="1.2" opacity="0.35" stroke-dasharray="3 3">
    <circle cx="110" cy="85" r="45" fill="none" />
  </g>
  
  <!-- Network Paths -->
  <path d="M 78,85 L 110,53 L 142,85 L 110,117 Z" fill="none" stroke="#80868b" stroke-width="0.8" opacity="0.25" />
  <path d="M 110,35 L 110,135 M 65,85 L 155,85" fill="none" stroke="#80868b" stroke-width="0.8" opacity="0.15" />

  <!-- Graph Nodes -->
  <circle cx="110" cy="35" r="4" fill="#EA4335" />
  <circle cx="155" cy="85" r="4" fill="#FBBC05" />
  <circle cx="110" cy="135" r="4" fill="#34A853" />
  <circle cx="65" cy="85" r="4" fill="#4285F4" />
  <circle cx="78" cy="53" r="3" fill="#4285F4" opacity="0.6" />
  <circle cx="142" cy="53" r="3" fill="#EA4335" opacity="0.6" />
  <circle cx="142" cy="117" r="3" fill="#FBBC05" opacity="0.6" />
  <circle cx="78" cy="117" r="3" fill="#34A853" opacity="0.6" />

  <!-- Compass Dial Highlights -->
  <circle cx="110" cy="85" r="35" fill="none" stroke="#80868b" stroke-width="0.8" opacity="0.15" />

  <!-- Center Stylized Compass Needle (Rotated 45 deg to point Northeast) -->
  <g transform="rotate(45 110 85)">
    <!-- North Pointer (Blue / Red) -->
    <path d="M 110,48 L 119,85 L 110,79 Z" fill="url(#blueGrad)" />
    <path d="M 110,48 L 101,85 L 110,79 Z" fill="url(#redGrad)" />
    
    <!-- South Pointer (Yellow / Green) -->
    <path d="M 110,122 L 119,85 L 110,91 Z" fill="url(#yellowGrad)" />
    <path d="M 110,122 L 101,85 L 110,91 Z" fill="url(#greenGrad)" />
    
    <!-- Needle shadows / dimension -->
    <path d="M 110,48 L 110,79 L 119,85 Z" fill="#000" opacity="0.06" />
    <path d="M 110,122 L 110,91 L 101,85 Z" fill="#000" opacity="0.06" />
  </g>

  <!-- Central Pivot -->
  <circle cx="110" cy="85" r="7" fill="#ffffff" />
  <circle cx="110" cy="85" r="4" fill="#4285F4" />

  <!-- Header Text Group (with spacious separation) -->
  <text x="220" y="98" class="text-main">
    <tspan class="text-bold">GSoC</tspan><tspan class="text-light">Pathfinder</tspan>
  </text>
</svg>
