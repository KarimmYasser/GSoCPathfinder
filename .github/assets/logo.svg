<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 150" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#2b62d9" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#c5281c" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBC05" />
      <stop offset="100%" stop-color="#dda103" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#247c3c" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#4285F4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .text-bold {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 42px;
      font-weight: 800;
      fill: #4285F4;
    }
    .text-light {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 42px;
      font-weight: 300;
      fill: #1f2937;
    }
    @media (prefers-color-scheme: dark) {
      .text-light {
        fill: #f9fafb;
      }
    }
  </style>

  <!-- Background Glow behind the compass -->
  <circle cx="75" cy="75" r="70" fill="url(#glow)" />

  <!-- Graph Network Nodes & Connections (Outer Compass Ring) -->
  <g stroke="#80868b" stroke-width="1.2" opacity="0.35" stroke-dasharray="3 3">
    <circle cx="75" cy="75" r="60" fill="none" />
  </g>
  
  <!-- Network Paths -->
  <path d="M 35,75 L 75,35 L 115,75 L 75,115 Z" fill="none" stroke="#80868b" stroke-width="0.8" opacity="0.25" />
  <path d="M 75,15 L 75,135 M 15,75 L 135,75" fill="none" stroke="#80868b" stroke-width="0.8" opacity="0.15" />

  <!-- Graph Nodes -->
  <circle cx="75" cy="15" r="4.5" fill="#EA4335" />
  <circle cx="135" cy="75" r="4.5" fill="#FBBC05" />
  <circle cx="75" cy="135" r="4.5" fill="#34A853" />
  <circle cx="15" cy="75" r="4.5" fill="#4285F4" />
  <circle cx="35" cy="35" r="3.5" fill="#4285F4" opacity="0.6" />
  <circle cx="115" cy="35" r="3.5" fill="#EA4335" opacity="0.6" />
  <circle cx="115" cy="115" r="3.5" fill="#FBBC05" opacity="0.6" />
  <circle cx="35" cy="115" r="3.5" fill="#34A853" opacity="0.6" />

  <!-- Compass Dial Highlights -->
  <circle cx="75" cy="75" r="48" fill="none" stroke="#80868b" stroke-width="0.8" opacity="0.15" />

  <!-- Center Stylized Compass Needle (Rotated 45 deg to point Northeast) -->
  <g transform="rotate(45 75 75)">
    <!-- North Pointer (Blue / Red) -->
    <path d="M 75,28 L 87,75 L 75,67 Z" fill="url(#blueGrad)" />
    <path d="M 75,28 L 63,75 L 75,67 Z" fill="url(#redGrad)" />
    
    <!-- South Pointer (Yellow / Green) -->
    <path d="M 75,122 L 87,75 L 75,83 Z" fill="url(#yellowGrad)" />
    <path d="M 75,122 L 63,75 L 75,83 Z" fill="url(#greenGrad)" />
    
    <!-- Needle shadows / dimension -->
    <path d="M 75,28 L 75,67 L 87,75 Z" fill="#000" opacity="0.06" />
    <path d="M 75,122 L 75,83 L 63,75 Z" fill="#000" opacity="0.06" />
  </g>

  <!-- Central Pivot -->
  <circle cx="75" cy="75" r="8" fill="#ffffff" />
  <circle cx="75" cy="75" r="5" fill="#4285F4" />

  <!-- Header Text Group -->
  <text x="150" y="88" class="text-main">
    <tspan class="text-bold">GSoC</tspan><tspan class="text-light">Pathfinder</tspan>
  </text>
</svg>
