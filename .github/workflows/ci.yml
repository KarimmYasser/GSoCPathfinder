name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-python:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Sync Dependencies & Build Rust Engine
        run: uv sync --all-extras --dev

      - name: Run Ruff Format Check
        run: uv run ruff format --check

      - name: Run Ruff Lint Check
        run: uv run ruff check

      - name: Run Pytest Tests
        run: uv run pytest tests/

  rust-engine:
    name: Rust Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust_engine -> target

      - name: Run Cargo Format Check
        run: cargo fmt --manifest-path rust_engine/Cargo.toml --check

      - name: Run Cargo Clippy
        run: cargo clippy --manifest-path rust_engine/Cargo.toml -- -D warnings

      - name: Run Cargo Tests
        run: cargo test --manifest-path rust_engine/Cargo.toml

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Build
        run: |
          cd frontend
          npm run build
