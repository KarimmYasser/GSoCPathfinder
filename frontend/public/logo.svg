<svg xmlns="http://www.w3.org/2000/svg" viewBox="58 33 104 104" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#2b62d9" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#c5281c" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBC05" />
      <stop offset="100%" stop-color="#dda103" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#247c3c" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#4285F4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Glow behind the compass -->
  <circle cx="110" cy="85" r="55" fill="url(#glow)" />

  <!-- Graph Network Nodes & Connections (Outer Compass Ring) -->
  <g stroke="#80868b" stroke-width="3" opacity="0.6" stroke-dasharray="6 6">
    <circle cx="110" cy="85" r="45" fill="none" />
  </g>
  
  <!-- Network Paths -->
  <path d="M 78,85 L 110,53 L 142,85 L 110,117 Z" fill="none" stroke="#80868b" stroke-width="2.5" opacity="0.4" />
  <path d="M 110,35 L 110,135 M 65,85 L 155,85" fill="none" stroke="#80868b" stroke-width="2.5" opacity="0.3" />

  <!-- Graph Nodes -->
  <circle cx="110" cy="35" r="7" fill="#EA4335" />
  <circle cx="155" cy="85" r="7" fill="#FBBC05" />
  <circle cx="110" cy="135" r="7" fill="#34A853" />
  <circle cx="65" cy="85" r="7" fill="#4285F4" />
  <circle cx="78" cy="53" r="5" fill="#4285F4" opacity="0.9" />
  <circle cx="142" cy="53" r="5" fill="#EA4335" opacity="0.9" />
  <circle cx="142" cy="117" r="5" fill="#FBBC05" opacity="0.9" />
  <circle cx="78" cy="117" r="5" fill="#34A853" opacity="0.9" />

  <!-- Compass Dial Highlights -->
  <circle cx="110" cy="85" r="35" fill="none" stroke="#80868b" stroke-width="2" opacity="0.3" />

  <!-- Center Stylized Compass Needle (Rotated 45 deg to point Northeast) -->
  <g transform="rotate(45 110 85)">
    <!-- North Pointer (Blue / Red) -->
    <path d="M 110,30 L 126,85 L 110,75 Z" fill="url(#blueGrad)" />
    <path d="M 110,30 L 94,85 L 110,75 Z" fill="url(#redGrad)" />
    
    <!-- South Pointer (Yellow / Green) -->
    <path d="M 110,140 L 126,85 L 110,95 Z" fill="url(#yellowGrad)" />
    <path d="M 110,140 L 94,85 L 110,95 Z" fill="url(#greenGrad)" />
    
    <!-- Needle shadows / dimension -->
    <path d="M 110,30 L 110,75 L 126,85 Z" fill="#000" opacity="0.08" />
    <path d="M 110,140 L 110,95 L 94,85 Z" fill="#000" opacity="0.08" />
  </g>

  <!-- Central Pivot -->
  <circle cx="110" cy="85" r="10" fill="#ffffff" />
  <circle cx="110" cy="85" r="6" fill="#4285F4" />
</svg>
